<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="RATING" content="RTA-5042-1996-1400-1577-RTA" />
</head>
<body>
    <button onclick="Netomi.chat.openWidget()">Support</button>
    <div id="chat-error" role="alert" style="display:none; color:#b00020; margin-top:12px;"></div>

    <script>
      (function() {
        var ns = document.createElement('script');
        ns.src = 'https://chatapps-qa-a.netomi.com/app/script.js';
        ns.type = 'text/javascript';
        ns.async = true;
        ns.setAttribute('botRefId', '8170350d-c7c4-4aaa-b42f-9d8b81350e5f');
        ns.setAttribute("enableEventQueue", "true");
        var s = document.getElementsByTagName('script')[0];
        s.parentNode.insertBefore(ns, s);

        // Maps a Netomi exceptionCode (and statusCode, if any) to a readable message.
        function getErrorMessage(error) {
          var code = error && error.exceptionCode;
          var status = error && error.statusCode;

          switch (code) {
            case 'REQUIRED_BOT_REFERENCE_ID':
              return 'The chat could not start because the bot ID is missing. ' +
                     'Set the botRefId attribute on the chat script.';

            case 'BOT_CONFIG_FETCH_FAILED':
              if (status === undefined || status === null) {
                return 'The chat could not load its settings. ' +
                       'You may be offline, so check your connection and try again.';
              }
              if (status === 403 || status === 404) {
                return 'The chat could not load its settings (' + status + '). ' +
                       'The bot ID may be wrong or not found. Check the botRefId.';
              }
              if (status >= 500) {
                return 'The chat service had a problem loading its settings (' + status + '). ' +
                       'Please try again later.';
              }
              return 'The chat could not load its settings (' + status + ').';

            default:
              return (error && error.statusMessage) ||
                     'The chat could not start because of an unknown error.';
          }
        }

        // Shows the message on the page so visitors are not left with a silent failure.
        function showErrorOnPage(message) {
          var box = document.getElementById('chat-error');
          if (box) {
            box.textContent = 'Support chat is currently unavailable.';
            box.style.display = 'block';
          }
        }

        ns.onload = function () {

          // ========== STARTUP ERRORS ONLY ==========
          /**
           * @param {Object} error
           * @param {string} error.exceptionCode - REQUIRED_BOT_REFERENCE_ID or BOT_CONFIG_FETCH_FAILED
           * @param {number} [error.statusCode] - HTTP status (e.g. 403); absent if the bot ID is
           *                                      missing or the user is offline
           * @param {string} error.statusMessage - Raw message, e.g. "Error while fetching Bot JSON"
           */
          Netomi.chat.onInitError(function (error) {
            var message = getErrorMessage(error);

            console.error('[Netomi Init Error] ' + message, {
              exceptionCode: error.exceptionCode,
              statusCode: error.statusCode,
              statusMessage: error.statusMessage
            });

            showErrorOnPage(message);
          });

          // ========== ALL SDK ERRORS ==========
          // Startup errors arrive here too (event_sub_type 'initialization_error'),
          // so they are skipped to avoid handling the same error twice.
          /**
           * @param {Object} error
           * @param {string} error.event_type - 'error'
           * @param {string} error.event_sub_type - e.g. 'initialization_error'
           * @param {string} error.type - e.g. 'config_fetch_failed'
           * @param {string} error.exceptionCode
           * @param {number} [error.statusCode]
           * @param {string} error.statusMessage
           * @param {string} error.error - Short description
           * @param {string} error.error_details - Combined details string
           */
          Netomi.chat.onError(function (error) {
            if (error.event_sub_type === 'initialization_error') {
              return;
            }

            console.error('[Netomi SDK Error] ' + getErrorMessage(error), {
              subType: error.event_sub_type,
              exceptionCode: error.exceptionCode,
              statusCode: error.statusCode,
              statusMessage: error.statusMessage,
              details: error.error_details
            });
          });

          // ========== ON_NEW_CONVERSATION Event ==========
          // This event fires ONLY when a new conversationId is created (not on page reload or MQTT reconnect).
          // The widget will WAIT for done() to be called before proceeding with proactive greetings.
          // If done() is not called, the widget will proceed after a timeout (default 2 seconds).
          Netomi.chat.onNewConversation(function(data) {
            console.log('[ON_NEW_CONVERSATION] New conversation started! ConversationId:', data.conversationId);

            // Example: Call your API with the new conversationId
            // Replace this with your actual API call
            setTimeout(function() {
              console.log('[ON_NEW_CONVERSATION] Async work complete. Calling done() to unblock the widget.');
              data.done(); // IMPORTANT: Call done() to unblock the widget and allow greetings to proceed
            }, 1000); // Simulating a 1-second API call
          });
        };
      })();
    </script>
</body>
</html>
