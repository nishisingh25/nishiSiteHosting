<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=Standards" />

  <title>Netomi Web Chat</title>
</head>

<body>

  <button type="button" onclick="handleAuth()">
    Start Authentication
  </button>

  <button type="button" onclick="endAuth()">
    Clear Authentication
  </button>

  <script>
    /*
     * ============================================================
     * NETOMI CONFIGURATION
     * ============================================================
     */

    const BOT_REF_ID =
      "47753183-8c01-4d49-bcfe-795770efc2a4";

    const SCRIPT_URL =
      "/script.js";

    const JWT_URL =
      "/api/fetchJWT";

    const AUTH_PAGE =
      "https://revanshasti.github.io/Hosting-sites/Authentication.html";


    /*
     * ============================================================
     * LOAD NETOMI SCRIPT
     * ============================================================
     */

    (function () {
      const ns = document.createElement("script");

      ns.src = SCRIPT_URL;
      ns.type = "text/javascript";
      ns.async = true;

      ns.setAttribute(
        "botRefId",
        BOT_REF_ID
      );

      /*
       * Required for the local webpack setup.
       */
      ns.setAttribute(
        "debug",
        "true"
      );

      /*
       * Enable Netomi event queue.
       */
      ns.setAttribute(
        "enableEventQueue",
        "true"
      );

      const firstScript =
        document.getElementsByTagName("script")[0];

      firstScript.parentNode.insertBefore(
        ns,
        firstScript
      );

      ns.onload = function () {
        console.log(
          "Netomi script loaded successfully."
        );

        console.log(
          "Bot Ref ID:",
          BOT_REF_ID
        );
      };

      ns.onerror = function (error) {
        console.error(
          "Unable to load /script.js",
          error
        );
      };
    })();


    /*
     * ============================================================
     * AUTHENTICATION STATE
     * ============================================================
     */

    let reAuthenticateIntervalId = null;


    /*
     * ============================================================
     * FETCH JWT TOKEN
     * ============================================================
     */

    async function fetchToken() {
      try {

        const tokenApiCall = await fetch(
          JWT_URL,
          {
            method: "POST",

            headers: {
              "href": AUTH_PAGE,

              "Content-Type":
                "application/json",

              "x-token-expiry":
                "10m",

              "x-bot-ref-id":
                BOT_REF_ID,

              "x-user-details":
                JSON.stringify({
                  name: "Revan Shasti",
                  externalId: "revan@gmail.com"
                })
            }
          }
        );


        if (!tokenApiCall.ok) {
          throw new Error(
            `JWT API returned ${tokenApiCall.status} ${tokenApiCall.statusText}`
          );
        }


        const response =
          await tokenApiCall.json();


        console.log(
          "JWT response received:",
          response
        );


        return response.token || "";

      } catch (error) {

        console.error(
          "Failed to fetch JWT:",
          error
        );

        return "";
      }
    }


    /*
     * ============================================================
     * START AUTHENTICATION
     * ============================================================
     */

    async function handleAuth() {
      try {

        /*
         * Make sure Netomi is available.
         */
        if (
          typeof Netomi === "undefined" ||
          !Netomi.chat
        ) {
          console.error(
            "Netomi.chat is not available yet."
          );

          return;
        }


        /*
         * Fetch the initial token.
         */
        const token =
          await fetchToken();


        if (!token) {
          console.error(
            "No JWT received. Login cancelled."
          );

          return;
        }


        /*
         * Login.
         */
        console.log(
          "Logging into Netomi..."
        );


        Netomi.chat.login(token);


        /*
         * Prevent duplicate refresh intervals.
         */
        if (
          reAuthenticateIntervalId
        ) {
          clearInterval(
            reAuthenticateIntervalId
          );
        }


        /*
         * Refresh authentication every
         * 5 minutes.
         */
        reAuthenticateIntervalId =
          setInterval(
            () => {

              if (
                typeof Netomi === "undefined" ||
                !Netomi.chat
              ) {
                console.error(
                  "Netomi.chat is unavailable."
                );

                return;
              }


              Netomi.chat.authenticate(
                async (
                  sendTokenToNetomi
                ) => {

                  try {

                    const refreshedToken =
                      await fetchToken();


                    if (!refreshedToken) {
                      console.error(
                        "Unable to obtain refreshed JWT."
                      );

                      handleAuthError();

                      return;
                    }


                    console.log(
                      "Sending refreshed JWT to Netomi..."
                    );


                    /*
                     * Send the new token to Netomi.
                     */
                    sendTokenToNetomi(
                      refreshedToken,
                      handleAuthError
                    );

                  } catch (error) {

                    console.error(
                      "Authentication refresh failed:",
                      error
                    );

                    handleAuthError();
                  }
                }
              );

            },
            300000
          );


        console.log(
          "Authentication started successfully."
        );

      } catch (error) {

        console.error(
          "Authentication failed:",
          error
        );
      }
    }


    /*
     * ============================================================
     * AUTHENTICATION ERROR HANDLER
     * ============================================================
     */

    function handleAuthError() {

      console.error(
        "Netomi authentication error."
      );
    }


    /*
     * ============================================================
     * END AUTHENTICATION
     * ============================================================
     */

    function endAuth() {

      /*
       * Stop token refresh.
       */
      if (
        reAuthenticateIntervalId
      ) {

        clearInterval(
          reAuthenticateIntervalId
        );

        reAuthenticateIntervalId = null;
      }


      /*
       * Logout from Netomi.
       */
      if (
        typeof Netomi !== "undefined" &&
        Netomi.chat
      ) {

        Netomi.chat.logout();

        console.log(
          "Authentication cleared."
        );
      }
    }


    /*
     * ============================================================
     * MANUAL LOGIN
     * ============================================================
     */

    async function manualLogin() {

      try {

        const token =
          await fetchToken();


        if (!token) {
          console.error(
            "Manual login failed: JWT not received."
          );

          return;
        }


        if (
          typeof Netomi === "undefined" ||
          !Netomi.chat
        ) {
          console.error(
            "Netomi.chat is not available."
          );

          return;
        }


        Netomi.chat.login(token);


        console.log(
          "Manual login successful."
        );

      } catch (error) {

        console.error(
          "Manual login failed:",
          error
        );
      }
    }


    /*
     * ============================================================
     * CLEAR NETOMI AUTHENTICATION
     * ============================================================
     */

    function clearAuth() {

      /*
       * Clear Netomi localStorage.
       */
      Object.keys(localStorage)
        .filter(
          (key) =>
            key.startsWith("net_")
        )
        .forEach(
          (key) => {
            localStorage.removeItem(key);
          }
        );


      /*
       * Clear Netomi cookies.
       */
      document.cookie
        .split(";")
        .forEach(
          (cookie) => {

            const name =
              cookie
                .split("=")[0]
                .trim();


            if (
              name.startsWith("net_")
            ) {

              document.cookie =
                `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;
            }
          }
        );


      /*
       * Reload page.
       */
      location.reload();
    }

  </script>

</body>

</html>
