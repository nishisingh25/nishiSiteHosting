<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Standards"
  />

  <title>Netomi Web Chat</title>
</head>

<body>

  <button
    type="button"
    onclick="handleAuth()"
  >
    Start Authentication
  </button>

  <button
    type="button"
    onclick="endAuth()"
  >
    Clear Authentication
  </button>


  <script>
    /*
     * ============================================================
     * NETOMI CONFIGURATION
     * ============================================================
     */

    const BOT_REF_ID =
      "3d51f888-5c9a-4e35-bd86-b4cb8cd00f12";

    /*
     * IMPORTANT:
     *
     * aakash.html:
     * /nishiSiteHosting/aakash.html
     *
     * script.js:
     * /nishiSiteHosting/script.js
     *
     * Therefore we use ./script.js
     */
    const SCRIPT_URL =
      "./script.js";

    const JWT_URL =
      "https://chatapps-qa-a.netomi.com/api/fetchJWT";

    const AUTH_PAGE =
      "https://nishisingh25.github.io/nishiSiteHosting/aakash.html";


    /*
     * ============================================================
     * LOAD NETOMI SCRIPT
     * ============================================================
     */

    (function () {

      const ns =
        document.createElement("script");

      ns.src = SCRIPT_URL;

      ns.type =
        "text/javascript";

      ns.async =
        true;


      ns.setAttribute(
        "botRefId",
        BOT_REF_ID
      );


      /*
       * Keep this because it was required by
       * your local integration.
       */
      ns.setAttribute(
        "debug",
        "true"
      );


      ns.setAttribute(
        "enableEventQueue",
        "true"
      );


      const firstScript =
        document.getElementsByTagName(
          "script"
        )[0];


      firstScript.parentNode.insertBefore(
        ns,
        firstScript
      );


      ns.onload = function () {

        console.log(
          "[Netomi] script.js loaded successfully."
        );

        console.log(
          "[Netomi] Bot Ref ID:",
          BOT_REF_ID
        );

      };


      ns.onerror = function (error) {

        console.error(
          "[Netomi] Unable to load script.js",
          error
        );

        console.error(
          "[Netomi] Expected URL:",
          new URL(
            SCRIPT_URL,
            window.location.href
          ).href
        );

      };

    })();


    /*
     * ============================================================
     * AUTHENTICATION STATE
     * ============================================================
     */

    let reAuthenticateIntervalId =
      null;


    /*
     * ============================================================
     * FETCH JWT
     * ============================================================
     */

    async function fetchToken() {

      try {

        console.log(
          "[Auth] Requesting JWT..."
        );


        const response =
          await fetch(
            JWT_URL,
            {
              method: "POST",

              headers: {

                "href":
                  AUTH_PAGE,

                "Content-Type":
                  "application/json",

                "x-token-expiry":
                  "10m",

                "x-bot-ref-id":
                  BOT_REF_ID,

                "x-user-details":
                  JSON.stringify({
                    name:
                      "Revan Shasti",

                    externalId:
                      "revan@gmail.com"
                  })

              }
            }
          );


        if (!response.ok) {

          throw new Error(
            `JWT request failed: ${response.status} ${response.statusText}`
          );

        }


        const data =
          await response.json();


        console.log(
          "[Auth] JWT response received."
        );


        return data.token || "";


      } catch (error) {

        console.error(
          "[Auth] JWT request failed:",
          error
        );

        return "";

      }

    }


    /*
     * ============================================================
     * START AUTHENTICATION
     * ============================================================
     */

    async function handleAuth() {

      try {

        if (
          typeof Netomi === "undefined" ||
          !Netomi.chat
        ) {

          console.error(
            "[Auth] Netomi.chat is not available."
          );

          return;

        }


        /*
         * Clear an existing refresh timer.
         */
        if (
          reAuthenticateIntervalId !== null
        ) {

          clearInterval(
            reAuthenticateIntervalId
          );

          reAuthenticateIntervalId =
            null;

        }


        /*
         * Get initial JWT.
         */
        const token =
          await fetchToken();


        if (!token) {

          console.error(
            "[Auth] No JWT received."
          );

          return;

        }


        /*
         * Initial login.
         */
        console.log(
          "[Auth] Calling Netomi.chat.login()..."
        );


        Netomi.chat.login(
          token
        );


        console.log(
          "[Auth] Login successful."
        );


        /*
         * ========================================================
         * RE-AUTHENTICATION
         * ========================================================
         *
         * Same 5-minute interval as your
         * original working implementation.
         */

        reAuthenticateIntervalId =
          setInterval(
            () => {

              if (
                typeof Netomi === "undefined" ||
                !Netomi.chat
              ) {

                console.error(
                  "[Auth] Netomi.chat unavailable."
                );

                return;

              }


              Netomi.chat.authenticate(
                async (
                  sendTokenToNetomi
                ) => {

                  try {

                    const refreshedToken =
                      await fetchToken();


                    if (!refreshedToken) {

                      console.error(
                        "[Auth] No refreshed JWT received."
                      );

                      handleAuthError();

                      return;

                    }


                    sendTokenToNetomi(
                      refreshedToken,
                      handleAuthError
                    );


                    console.log(
                      "[Auth] Token refreshed successfully."
                    );

                  } catch (error) {

                    console.error(
                      "[Auth] Token refresh failed:",
                      error
                    );

                    handleAuthError();

                  }

                }
              );

            },
            300000
          );

      } catch (error) {

        console.error(
          "[Auth] Authentication failed:",
          error
        );

      }

    }


    /*
     * ============================================================
     * AUTHENTICATION ERROR
     * ============================================================
     */

    function handleAuthError() {

      console.error(
        "[Auth] Netomi authentication error."
      );

    }


    /*
     * ============================================================
     * LOGOUT
     * ============================================================
     */

    function endAuth() {

      if (
        reAuthenticateIntervalId !== null
      ) {

        clearInterval(
          reAuthenticateIntervalId
        );

        reAuthenticateIntervalId =
          null;

      }


      if (
        typeof Netomi !== "undefined" &&
        Netomi.chat
      ) {

        Netomi.chat.logout();

        console.log(
          "[Auth] Authentication cleared."
        );

      }

    }


    /*
     * ============================================================
     * MANUAL LOGIN
     * ============================================================
     */

    async function manualLogin() {

      const token =
        await fetchToken();


      if (!token) {
        return;
      }


      if (
        typeof Netomi === "undefined" ||
        !Netomi.chat
      ) {

        console.error(
          "[Auth] Netomi.chat is unavailable."
        );

        return;

      }


      Netomi.chat.login(
        token
      );

    }


    /*
     * ============================================================
     * CLEAR NETOMI STORAGE
     * ============================================================
     */

    function clearAuth() {

      Object.keys(
        localStorage
      )
        .filter(
          (key) =>
            key.startsWith("net_")
        )
        .forEach(
          (key) => {
            localStorage.removeItem(
              key
            );
          }
        );


      document.cookie
        .split(";")
        .forEach(
          (cookie) => {

            const name =
              cookie
                .split("=")[0]
                .trim();


            if (
              name.startsWith("net_")
            ) {

              document.cookie =
                `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;

            }

          }
        );


      location.reload();

    }

  </script>

</body>

</html>
