  <script>
    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     */

    const BOT_REF_ID =
      "47753183-8c01-4d49-bcfe-795770efc2a4";

    const SCRIPT_URL =
      "/script.js";

    const JWT_URL =
      "/api/fetchJWT";

    const AUTH_PAGE =
      "https://revanshasti.github.io/Hosting-sites/Authentication.html";


    /*
     * ============================================================
     * NETOMI SCRIPT
     * ============================================================
     *
     * IMPORTANT:
     * /script.js must be served by the webpack-dev-server.
     *
     * This is the same LOCAL setup used by your original
     * NET-65437 reproduction page.
     */

    (function () {
      const ns = document.createElement("script");

      ns.src = SCRIPT_URL;
      ns.type = "text/javascript";
      ns.async = true;

      ns.setAttribute(
        "botRefId",
        BOT_REF_ID
      );

      /*
       * Required by the local webpack setup.
       */
      ns.setAttribute(
        "debug",
        "true"
      );

      /*
       * Enable event queue.
       */
      ns.setAttribute(
        "enableEventQueue",
        "true"
      );

      const firstScript =
        document.getElementsByTagName("script")[0];

      firstScript.parentNode.insertBefore(
        ns,
        firstScript
      );

      ns.onload = function () {
        console.log(
          "[Netomi] script.js loaded"
        );

        console.log(
          "[Netomi] botRefId:",
          BOT_REF_ID
        );

        console.log(
          "[Netomi] Waiting for Netomi.chat..."
        );
      };

      ns.onerror = function (event) {
        console.error(
          "[Netomi] Unable to load /script.js"
        );

        console.error(
          "[Netomi] Make sure this page is being served by the webpack-dev-server."
        );

        console.error(
          "[Netomi] Current page:",
          window.location.href
        );
      };
    })();


    /*
     * ============================================================
     * AUTHENTICATION STATE
     * ============================================================
     */

    let reAuthenticateIntervalId = null;


    /*
     * ============================================================
     * FETCH JWT
     * ============================================================
     */

    async function fetchToken() {
      try {

        console.log(
          "[Auth] Requesting JWT..."
        );


        const response = await fetch(
          JWT_URL,
          {
            method: "POST",

            headers: {
              "href": AUTH_PAGE,

              "Content-Type":
                "application/json",

              "x-token-expiry":
                "10m",

              "x-bot-ref-id":
                BOT_REF_ID,

              "x-user-details":
                JSON.stringify({
                  name: "Revan Shasti",
                  externalId: "revan@gmail.com"
                })
            }
          }
        );


        if (!response.ok) {
          throw new Error(
            `JWT API returned ${response.status} ${response.statusText}`
          );
        }


        const data =
          await response.json();


        if (!data.token) {
          throw new Error(
            "JWT API response does not contain a token."
          );
        }


        console.log(
          "[Auth] JWT received successfully."
        );


        return data.token;

      } catch (error) {

        console.error(
          "[Auth] JWT request failed:",
          error
        );

        return "";
      }
    }


    /*
     * ============================================================
     * START AUTHENTICATION
     * ============================================================
     */

    async function handleAuth() {
      try {

        /*
         * Make sure Netomi is loaded.
         */
        if (
          typeof Netomi === "undefined" ||
          !Netomi.chat
        ) {
          console.error(
            "[Auth] Netomi.chat is not available."
          );

          console.error(
            "[Auth] Check that /script.js loaded successfully."
          );

          return;
        }


        /*
         * Stop an existing refresh interval.
         */
        if (
          reAuthenticateIntervalId !== null
        ) {
          clearInterval(
            reAuthenticateIntervalId
          );

          reAuthenticateIntervalId = null;
        }


        /*
         * Get initial JWT.
         */
        const token =
          await fetchToken();


        if (!token) {
          console.error(
            "[Auth] Initial authentication cancelled."
          );

          return;
        }


        /*
         * Login.
         */
        console.log(
          "[Auth] Calling Netomi.chat.login()..."
        );

        Netomi.chat.login(token);


        console.log(
          "[Auth] Login successful."
        );


        /*
         * ========================================================
         * TOKEN REFRESH
         * ========================================================
         *
         * Original working implementation refreshed every
         * 5 minutes.
         */

        reAuthenticateIntervalId =
          setInterval(
            () => {

              if (
                typeof Netomi === "undefined" ||
                !Netomi.chat
              ) {
                console.error(
                  "[Auth] Netomi.chat is unavailable."
                );

                return;
              }


              console.log(
                "[Auth] Starting token refresh..."
              );


              Netomi.chat.authenticate(
                async (
                  sendTokenToNetomi
                ) => {

                  try {

                    const token =
                      await fetchToken();


                    if (!token) {
                      console.error(
                        "[Auth] No refreshed token received."
                      );

                      handleAuthError();

                      return;
                    }


                    console.log(
                      "[Auth] Sending refreshed token to Netomi..."
                    );


                    /*
                     * Send the refreshed token.
                     */
                    sendTokenToNetomi(
                      token,
                      handleAuthError
                    );


                    console.log(
                      "[Auth] Token refresh completed."
                    );

                  } catch (error) {

                    console.error(
                      "[Auth] Token refresh failed:",
                      error
                    );

                    handleAuthError();
                  }
                }
              );

            },
            300000
          );

      } catch (error) {

        console.error(
          "[Auth] Authentication failed:",
          error
        );
      }
    }


    /*
     * ============================================================
     * AUTH ERROR
     * ============================================================
     */

    function handleAuthError() {

      console.error(
        "[Auth] Netomi authentication error."
      );
    }


    /*
     * ============================================================
     * END AUTHENTICATION
     * ============================================================
     */

    function endAuth() {

      /*
       * Stop refresh timer.
       */
      if (
        reAuthenticateIntervalId !== null
      ) {

        clearInterval(
          reAuthenticateIntervalId
        );

        reAuthenticateIntervalId = null;
      }


      /*
       * Logout.
       */
      if (
        typeof Netomi !== "undefined" &&
        Netomi.chat
      ) {

        Netomi.chat.logout();

        console.log(
          "[Auth] Logged out successfully."
        );
      }
    }


    /*
     * ============================================================
     * MANUAL LOGIN
     * ============================================================
     */

    async function manualLogin() {

      const token =
        await fetchToken();


      if (!token) {
        return;
      }


      if (
        typeof Netomi === "undefined" ||
        !Netomi.chat
      ) {
        console.error(
          "[Auth] Netomi.chat is not available."
        );

        return;
      }


      Netomi.chat.login(token);


      console.log(
        "[Auth] Manual login successful."
      );
    }


    /*
     * ============================================================
     * CLEAR NETOMI AUTH
     * ============================================================
     */

    function clearAuth() {

      /*
       * Clear Netomi localStorage.
       */
      Object.keys(localStorage)
        .filter(
          (key) =>
            key.startsWith("net_")
        )
        .forEach(
          (key) => {
            localStorage.removeItem(key);
          }
        );


      /*
       * Clear Netomi cookies.
       */
      document.cookie
        .split(";")
        .forEach(
          (cookie) => {

            const name =
              cookie
                .split("=")[0]
                .trim();


            if (
              name.startsWith("net_")
            ) {

              document.cookie =
                `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;
            }
          }
        );


      /*
       * Reload.
       */
      location.reload();
    }

  </script>
