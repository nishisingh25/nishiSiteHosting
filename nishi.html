<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Netomi sendEvent Test</title>
</head>

<body>

<script>
"use strict";

(function () {

    const script = document.createElement("script");

    script.src = "https://chatapps-us.netomi.com/app/script.js";
    script.async = true;
    script.type = "text/javascript";

    script.setAttribute(
        "botRefId",
        "938dcb64-4141-4347-984b-1090f15c66a1"
    );

    script.setAttribute(
        "enableEventQueue",
        "true"
    );


    script.onload = function () {

        console.log("SDK Loaded");


        if (
            !window.NETOMI_WEB_WIDGET ||
            typeof window.NETOMI_WEB_WIDGET.init !== "function"
        ) {

            console.error(
                "NETOMI_WEB_WIDGET.init not found."
            );

            return;
        }


        window.NETOMI_WEB_WIDGET.init(function () {

            console.log("Widget Initialized");

        });


        window.NETOMI_WEB_WIDGET.onLoad(function () {

            console.log("Widget Loaded");

            console.log("Netomi =",window.Netomi);

            console.log("Netomi.chat =",window.Netomi.chat);


            /* 
             * Update bot title and subtitle
             */
            if (Netomi.chat && typeof Netomi.chat.changeBotConfig === "function") {
                Netomi.chat.changeBotConfig({
                    title: "Updated Title Nishi",
                    subtitle: ""
                });


                console.log("Bot configuration updated");

            } else {
                console.warn("Netomi.chat.changeBotConfig is not available");
            }



            /*
             * Send custom event
             */
            if (Netomi.chat && typeof Netomi.chat.sendEvent === "function") {

                Netomi.chat.sendEvent({

                    eventData: {
                        eventType: "WIDGET_EVENT",
                        subType: "GENERIC",
                        eventInfo: {
                            message:"Host page triggered this event- test nishi",
                            source:"nishi site hosting repo"
                        }
                    },

                    eventName: "INFO"

                });

                console.log("sendEvent() invoked" );
            } else {

                console.warn("Netomi.chat.sendEvent is not available");
            }
        });
    };


    script.onerror = function () {

        console.error("Failed to load SDK.");
};

    document.head.appendChild(script);


})();
</script>

</body>
</html>
